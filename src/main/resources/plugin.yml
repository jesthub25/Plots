name: Arsa
version: '${project.version}'
main: org.jestron.arsa.ArsaPlugin
api-version: '1.20'
author: Jestron
website: https://github.com/jesthub25/Plots
description: Koordinat tabanli, kiralamali, detayli izin sistemli, iki dilli (TR/EN) arsa eklentisi (1.20.1+).
softdepend: [Vault, WorldEdit, FastAsyncWorldEdit]

commands:
  arsa:
    description: Arsa ana komutu (Turkce). Tum islemler bu komut uzerinden yapilir.
    usage: /arsa <kirala|terket|sure|bilgi|sahip|gui|yetkiver|yetkial|ziyaretci|izinler|yardim>
  plot:
    description: Arsa main command (English). All actions run through this command.
    usage: /plot <rent|leave|time|info|owner|gui|trust|untrust|visitor|perms|help>

permissions:
  arsa.oyuncu:
    description: Tum oyuncu komutlari.
    default: true
    children:
      arsa.kiralama.kirala: true
      arsa.kiralama.terket: true
      arsa.kiralama.sure: true
      arsa.gui: true
  arsa.kiralama.kirala:
    description: /arsa kirala
    default: true
  arsa.kiralama.terket:
    description: /arsa terket
    default: true
  arsa.kiralama.sure:
    description: /arsa sure
    default: true
  arsa.gui:
    description: /arsa gui (yine de sadece arsa sahibi ve MOD acabilir)
    default: true

  arsa.admin:
    description: Tum admin yetkileri.
    default: op
    children:
      arsa.admin.olustur: true
      arsa.admin.sil: true
      arsa.admin.liste: true
      arsa.admin.bypass: true
      arsa.admin.sablon: true
      arsa.admin.yenile: true
      arsa.admin.yonet: true
  arsa.admin.*:
    description: arsa.admin ile ayni.
    default: op
    children:
      arsa.admin: true
  arsa.admin.olustur:
    description: /arsa olustur
    default: op
  arsa.admin.sil:
    description: /arsa sil
    default: op
  arsa.admin.liste:
    description: /arsa liste
    default: op
  arsa.admin.bypass:
    description: /arsa bypass ile koruma atlatmayi acabilme (sadece acikken gecerli).
    default: op
  arsa.admin.sablon:
    description: /arsa sablon
    default: op
  arsa.admin.yenile:
    description: /arsa yenile
    default: op
  arsa.admin.yonet:
    description: Her arsanin yonetim panelini sahibi gibi kullanabilme.
    default: op
